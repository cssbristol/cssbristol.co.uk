<section class="hero hero--light">
  <h1 class="hero__title"><span class="hero__title--small">{{ include.pretitle }}</span><br />{{ include.title }}</h1>
  {% for button in include.buttons %}
    <a class="btn btn--light" href="{{ button.location }}">
      {{ button.text }}
    </a>
  {% endfor %}
</section>
